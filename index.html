
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Calculator</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #101426, #202a48, #151526);
  color: white;
}

.calculator {
  width: 100%;
  max-width: 370px;
  padding: 25px;
  border: 1px solid #ffffff20;
  border-radius: 30px;
  background: rgba(20, 24, 43, 0.92);
  box-shadow: 0 25px 70px #0008;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}

.header h2 {
  font-size: 22px;
  letter-spacing: 1px;
}

.header span {
  color: #8d91ad;
  font-size: 12px;
}

.display {
  min-height: 125px;
  padding: 18px 8px;
  text-align: right;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  overflow: hidden;
}

.previous {
  color: #9298b7;
  font-size: 17px;
  min-height: 25px;
  overflow-wrap: anywhere;
}

.current {
  font-size: clamp(34px, 10vw, 45px);
  font-weight: 600;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 20px;
}

button {
  border: none;
  min-width: 0;
  aspect-ratio: 1;
  border-radius: 18px;
  font-size: 21px;
  font-weight: 500;
  color: white;
  background: #282e49;
  cursor: pointer;
  transition: transform .15s, filter .15s;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  transform: scale(.92);
  filter: brightness(1.3);
}

button.utility {
  background: #393f5b;
  color: #b8c5ff;
}

button.operator {
  background: linear-gradient(145deg, #7758f7, #593be0);
  box-shadow: 0 5px 15px #6745ef35;
}

button.equal {
  background: linear-gradient(145deg, #ff9b61, #ff654e);
  box-shadow: 0 5px 15px #ff765035;
}

button.zero {
  grid-column: span 2;
  aspect-ratio: auto;
}

button.wide {
  font-size: 17px;
}

.footer {
  text-align: center;
  margin-top: 22px;
  font-size: 11px;
  color: #777f9f;
  letter-spacing: 2px;
}

.history {
  display: none;
  margin-top: 18px;
  padding: 14px;
  background: #282e49;
  border-radius: 15px;
}

.history h3 {
  font-size: 14px;
  margin-bottom: 10px;
}

.history p {
  color: #b8c5ff;
  font-size: 13px;
  padding: 5px 0;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>
<main class="calculator">
  <div class="header">
    <h2>✦ NOVA</h2>
    <span>SMART CALCULATOR</span>
  </div>

  <section class="display" aria-live="polite">
    <div class="previous" id="previous"></div>
    <div class="current" id="display">0</div>
  </section>

  <section class="buttons">
    <button class="utility" data-action="clear">AC</button>
    <button class="utility" data-action="delete">DEL</button>
    <button class="utility" data-action="percent">%</button>
    <button class="operator" data-op="÷">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="operator" data-op="×">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="operator" data-op="−">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="operator" data-op="+">+</button>

    <button class="utility wide" data-action="sign">+/−</button>
    <button class="zero" data-num="0">0</button>
    <button data-action="decimal">.</button>
    <button class="equal" data-action="equals">=</button>
  </section>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:22px">
    <span style="font-size:12px;color:#9298b7">Recent calculations</span>
    <button id="historyToggle" style="aspect-ratio:auto;padding:9px 13px;font-size:12px;border-radius:10px;background:#393f5b">
      History ↗
    </button>
  </div>

  <section class="history" id="history">
    <h3>Calculation history</h3>
    <div id="historyItems"><p>No calculations yet</p></div>
  </section>

  <div class="footer">SIMPLE · SMART · BEAUTIFUL</div>
</main>

<script>
const display = document.getElementById("display");
const previous = document.getElementById("previous");
const historyBox = document.getElementById("history");
const historyItems = document.getElementById("historyItems");

let current = "0";
let stored = null;
let operator = null;
let waiting = false;
let expression = "";
let history = [];

function render() {
  display.textContent = current;
  previous.textContent = expression;
}

function format(n) {
  if (!Number.isFinite(n)) return "Error";
  return String(Number(n.toPrecision(12)));
}

function inputNumber(n) {
  if (current === "Error" || waiting) {
    current = n;
    waiting = false;
  } else if (current === "0") {
    current = n;
  } else if (current.length < 16) {
    current += n;
  }
  render();
}

function decimal() {
  if (current === "Error" || waiting) {
    current = "0.";
    waiting = false;
  } else if (!current.includes(".")) {
    current += ".";
  }
  render();
}

function calculate(a, b, op) {
  switch (op) {
    case "+": return a + b;
    case "−": return a - b;
    case "×": return a * b;
    case "÷": return b === 0 ? NaN : a / b;
    default: return b;
  }
}

function chooseOperator(op) {
  if (current === "Error") return;

  const value = Number(current);

  if (operator && !waiting) {
    const result = calculate(stored, value, operator);
    current = format(result);
    if (current === "Error") {
      reset();
      current = "Error";
      render();
      return;
    }
    stored = Number(current);
  } else {
    stored = value;
  }

  operator = op;
  expression = current + " " + op;
  waiting = true;
  render();
}

function equals() {
  if (!operator || waiting || current === "Error") return;

  const a = stored;
  const b = Number(current);
  const op = operator;
  const result = calculate(a, b, op);

  const line = `${format(a)} ${op} ${format(b)} = ${format(result)}`;

  if (Number.isFinite(result)) {
    history.unshift(line);
    history = history.slice(0, 8);
    updateHistory();
  }

  expression = `${format(a)} ${op} ${format(b)} =`;
  current = format(result);
  stored = null;
  operator = null;
  waiting = true;
  render();
}

function reset() {
  current = "0";
  stored = null;
  operator = null;
  waiting = false;
  expression = "";
  render();
}

function updateHistory() {
  historyItems.innerHTML = "";
  if (!history.length) {
    historyItems.textContent = "No calculations yet";
    return;
  }

  history.forEach(item => {
    const p = document.createElement("p");
    p.textContent = item;
    historyItems.appendChild(p);
  });
}

function action(name) {
  if (name === "clear") reset();

  if (name === "delete") {
    if (current === "Error" || waiting) {
      current = "0";
      waiting = false;
    } else {
      current = current.length > 1
        ? current.slice(0, -1)
        : "0";
      if (current === "-") current = "0";
    }
    render();
  }

  if (name === "decimal") decimal();

  if (name === "sign" && current !== "Error") {
    current = format(-Number(current));
    render();
  }

  if (name === "percent" && current !== "Error") {
    current = format(Number(current) / 100);
    render();
  }

  if (name === "equals") equals();
}

document.querySelectorAll("[data-num]").forEach(button => {
  button.addEventListener("click", () =>
    inputNumber(button.dataset.num)
  );
});

document.querySelectorAll("[data-op]").forEach(button => {
  button.addEventListener("click", () =>
    chooseOperator(button.dataset.op)
  );
});

document.querySelectorAll("[data-action]").forEach(button => {
  button.addEventListener("click", () =>
    action(button.dataset.action)
  );
});

document.getElementById("historyToggle").addEventListener("click", () => {
  historyBox.style.display =
    historyBox.style.display === "block" ? "none" : "block";
});

document.addEventListener("keydown", event => {
  if (/^[0-9]$/.test(event.key)) inputNumber(event.key);
  else if (event.key === ".") decimal();
  else if (event.key === "+") chooseOperator("+");
  else if (event.key === "-") chooseOperator("−");
  else if (event.key === "*") chooseOperator("×");
  else if (event.key === "/") {
    event.preventDefault();
    chooseOperator("÷");
  }
  else if (event.key === "Enter" || event.key === "=") equals();
  else if (event.key === "Backspace") action("delete");
  else if (event.key === "Escape") reset();
  else if (event.key === "%") action("percent");
});
</script>
</body>
</html>
